<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404: proper lost, mate. (fiskal)</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0e">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>
<body>

  <main class="fourohfour" id="main">
    <div class="container fourohfour__grid">

      <!-- road closure sign -->
      <section class="closure" aria-labelledby="notFoundTitle">
        <p class="closure__tag">road closed</p>
        <h1 class="closure__title" id="notFoundTitle">proper lost, mate.</h1>
        <p class="closure__text">this page doesn't exist. it may have been diverted, reverted, or quietly abandoned without notice.</p>
      </section>

      <!-- you are here -->
      <section class="map" aria-label="you are here">
        <div class="map__pin" aria-hidden="true"></div>
        <p class="map__label">you are here</p>
        <p class="map__where">in the middle of bloody nowhere mate</p>
      </section>

      <!-- diversion sign -->
      <a class="diversion" href="index.html">
        <span class="diversion__arrow" aria-hidden="true">←</span>
        <span class="diversion__text">
          <span class="diversion__small">diversion</span>
          <span class="diversion__dest">home (J0)</span>
        </span>
      </a>

      <p class="fourohfour__fine">still lost? try dm me. i'm quicker than the bus.</p>
    </div>
  </main>

</body>
</html>
